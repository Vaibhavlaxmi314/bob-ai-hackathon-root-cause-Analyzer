submission:
  title: "Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"   # REQUIRED

  problem_statement: >                 # REQUIRED
    Global supply chains are continuously exposed to disruptions — port strikes, severe weather,
    and geopolitical crises — that cascade silently across hundreds of active shipments simultaneously.
    Logistics teams have no automated way to identify which shipments are trapped, find alternative
    routes, locate idle fleet assets nearby, or detect cold chain temperature excursions before
    they reach delivery, resulting in cargo losses exceeding $500,000 and 2–3x emergency freight costs.

  solution_summary: >                  # REQUIRED
    We built an AI-powered operational assistant on IBM Bob that gives logistics teams a unified,
    real-time view of supply chain disruptions. A Bob agent ingests simulated disruption events,
    shipment manifests, fleet telemetry, and IoT temperature sensor logs, then uses watsonx.ai
    Granite to identify affected shipments, recommend alternative routes, surface idle fleet assets
    for redeployment, and classify cold chain excursion severity — all from a single React dashboard.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Disruption-to-Shipment Impact Mapping: cross-references live disruption events against active shipment legs to identify affected shipments with severity scores"
    - "AI-Powered Re-routing Recommendations: Bob agent queries watsonx.ai Granite with route context to produce ranked carrier and route alternatives with plain-language reasoning"
    - "Idle Fleet Asset Redeployment Scanner: analyses simulated fleet telemetry to surface idle trucks, containers, and reefer vessels near disrupted regions for redeployment"
    - "Cold Chain Excursion Detection and Severity Classification: monitors IoT temperature sensor logs and uses watsonx.ai to classify breach severity and recommend action before delivery"
    - "Unified React Operations Dashboard: presents all four analysis outputs in a single operational view without manual data aggregation across siloed systems"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "IBM Bob SDK", "React 18"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["SQLite"]
    other: ["GitHub Actions", "MCP Protocol", "simulated JSON/CSV seed data"]

  what_we_are_most_proud_of: >         # Optional but recommended
    The cold chain excursion detection and severity classification pipeline is our strongest feature.
    Connecting IoT time-series temperature data to a watsonx.ai Granite classification call —
    with structured context about cargo type, excursion magnitude, and duration — produces genuinely
    useful severity assessments and action recommendations. This directly addresses the $500K+ cargo
    loss scenario in the problem statement and demonstrates meaningful, grounded use of IBM Bob and
    watsonx.ai together rather than a surface-level integration.

  known_limitations: >                 # Optional but recommended
    All disruption events, shipment manifests, fleet telemetry, and IoT sensor logs are simulated
    JSON/CSV files seeded at startup — no live third-party APIs or carrier systems are integrated.
    The FastAPI backend and React dashboard have no authentication layer in this prototype.
    The solution runs locally as a single process; production deployment infrastructure and
    horizontal scaling are not included in this submission.

